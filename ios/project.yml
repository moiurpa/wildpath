# XcodeGen spec. On a Mac: `brew install xcodegen`, then `xcodegen generate`
# in this folder to create WildPath.xcodeproj.
name: WildPath
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
packages:
  GoogleMaps:
    url: https://github.com/googlemaps/ios-maps-sdk
    from: "9.0.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  WildPath:
    type: application
    platform: iOS
    sources:
      - path: WildPath
    dependencies:
      - package: GoogleMaps
        product: GoogleMaps
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.wildpath
        INFOPLIST_FILE: WildPath/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: WildPath/WildPath.entitlements
        TARGETED_DEVICE_FAMILY: "1"
